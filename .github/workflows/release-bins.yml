name: release-bins

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to
        required: true
        default: v0.2.28

permissions:
  contents: write

jobs:
  bins:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: acid-judge-linux-x86_64
          - os: windows-latest
            artifact: acid-judge-windows-x86_64.exe
          - os: macos-latest
            artifact: acid-judge-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.75.0"
      - name: Build
        run: cargo build --release --locked --manifest-path rust/acid-judge/Cargo.toml
      - name: Name artifact (unix)
        if: runner.os != 'Windows'
        run: |
          src=rust/acid-judge/target/release/acid-judge
          cp "$src" "${{ matrix.artifact }}"
          strip "${{ matrix.artifact }}" || true
      - name: Name artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item rust\acid-judge\target\release\acid-judge.exe ${{ matrix.artifact }}
      - name: Checksum
        shell: bash
        env:
          ART: ${{ matrix.artifact }}
        run: |
          python -c "
          import hashlib, pathlib, os
          p = pathlib.Path(os.environ['ART'])
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path(str(p) + '.sha256').write_text(f'{digest}  {p.name}\n', encoding='ascii')
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          gh release upload "$tag" "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256" --clobber --repo "${{ github.repository }}"

name: release-bins

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to
        required: true
        default: v0.2.4

permissions:
  contents: write

jobs:
  bins:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: acid-judge-linux-x86_64
          - os: windows-latest
            artifact: acid-judge-windows-x86_64.exe
          - os: macos-latest
            artifact: acid-judge-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"
      - name: Build
        run: cargo build --release --locked --manifest-path rust/acid-judge/Cargo.toml
      - name: Name artifact (unix)
        if: runner.os != 'Windows'
        run: |
          src=rust/acid-judge/target/release/acid-judge
          cp "$src" "${{ matrix.artifact }}"
          strip "${{ matrix.artifact }}" || true
      - name: Name artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item rust\acid-judge\target\release\acid-judge.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ github.event.inputs.tag }}"
          fi
          gh release upload "$tag" "${{ matrix.artifact }}" --clobber --repo "${{ github.repository }}"

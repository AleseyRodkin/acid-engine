name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata name
        run: |
          python - <<'PY'
          from pathlib import Path
          names = list(Path("dist").glob("*.tar.gz"))
          assert names, "no sdist"
          assert names[0].name.startswith("acid_judge-"), names[0].name
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598

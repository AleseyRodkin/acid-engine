name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist_name: acid-judge
            sdist_prefix: acid_judge-
          - dist_name: acid-engine
            sdist_prefix: acid_engine-
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set distribution name
        env:
          DIST_NAME: ${{ matrix.dist_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          name = os.environ["DIST_NAME"]
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          path.write_text(
              text.replace('name = "acid-judge"', f'name = "{name}"', 1),
              encoding="utf-8",
          )
          PY
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata name
        env:
          SDIST_PREFIX: ${{ matrix.sdist_prefix }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          prefix = os.environ["SDIST_PREFIX"]
          names = list(Path("dist").glob("*.tar.gz"))
          assert names, "no sdist"
          assert names[0].name.startswith(prefix), names[0].name
          PY
      - name: Publish
        # Docker image is published for the v1.13.0 tag, not for a commit SHA.
        uses: pypa/gh-action-pypi-publish@v1.13.0

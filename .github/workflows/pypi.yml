name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata name
        run: |
          python - <<'PY'
          from pathlib import Path
          names = list(Path("dist").glob("*.tar.gz"))
          assert names, "no sdist"
          assert names[0].name.startswith("acid_judge-"), names[0].name
          PY
      - name: Publish
        # Docker image is published for the v1.13.0 tag, not for a commit SHA.
        uses: pypa/gh-action-pypi-publish@v1.13.0

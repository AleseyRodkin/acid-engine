name: release

# Cut a release by pushing a tag. Do not create the GitHub Release first.
# Flow: tag v0.2.N → this workflow (gate + gh release create)
#     → existing release-bins.yml + pypi.yml on release published.
#
#   git tag v0.2.29
#   git push origin v0.2.29
#
# pyproject.toml version must equal the tag without the leading v.
# Contour / locks are not touched here.

on:
  push:
    tags:
      - "v0.2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.2.29)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.75.0"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check acid_engine tests examples research
      - name: Mypy
        run: python -m mypy --strict acid_engine locks/ci_judge.py
      - name: Pytest
        run: python -m pytest tests -q
      - name: Cargo test
        run: cargo test --locked --manifest-path rust/acid-judge/Cargo.toml
      - name: Tag matches pyproject version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          tag="${tag#refs/tags/}"
          case "$tag" in
            v0.2.*) ;;
            *) echo "tag must look like v0.2.N, got $tag"; exit 1 ;;
          esac
          ver="${tag#v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$py" != "$ver" ]; then
            echo "pyproject.toml version=$py tag=$tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version match $tag"

  github-release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          title="${TAG#v}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "$title" \
            --notes "See CHANGELOG.md. Supervisor binaries attach from release-bins. PyPI from the pypi workflow."

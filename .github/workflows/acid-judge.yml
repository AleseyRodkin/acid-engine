name: acid-judge

on:
  push:
  pull_request:

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lock index
        run: PYTHONPATH=. python -m acid_engine locks --index locks/index.json
      - name: Judge locked tools
        run: PYTHONPATH=. python locks/ci_judge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipts
          path: receipts/

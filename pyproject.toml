[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acid-engine"
version = "0.1.0"
description = "Contract-driven execution engine"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.1", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["acid_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["acid_engine", "tests", "examples"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "."
packages = ["acid_engine"]

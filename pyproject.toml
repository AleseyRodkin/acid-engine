[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acid-judge"
version = "0.2.24"
description = "Fail-closed gate for a locked Python-tool body"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodkin Aleksey"}]
keywords = ["execution-integrity", "ai-agents", "fail-closed", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AleseyRodkin/acid-engine"
Issues = "https://github.com/AleseyRodkin/acid-engine/issues"
Changelog = "https://github.com/AleseyRodkin/acid-engine/blob/main/CHANGELOG.md"

[project.scripts]
acid-judge = "acid_engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.1", "hypothesis>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["acid_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["acid_engine", "tests", "examples", "locks"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
"tests/property/**/*.py" = ["E402", "I001"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "."
packages = ["acid_engine"]

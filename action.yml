name: Acid Judge
description: Fail-closed lock check for a Python tool body. Catches a file swap between lock and CI. Does not sandbox.
author: Rodkin Aleksey
branding:
  icon: shield
  color: gray-dark
inputs:
  index:
    description: Path to locks/index.json in the calling repository
    required: false
    default: locks/index.json
  python-version:
    description: CPython for the CLI / worker
    required: false
    default: "3.11"
  judge:
    description: After bind, run judge and write receipts. Default false = bind only (python-cli). Supervisor path always judges.
    required: false
    default: "false"
  receipts:
    description: Receipt directory when judge is true (python-cli) or on the supervisor path
    required: false
    default: receipts
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Acid Judge
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Fetch supervisor
      shell: bash
      env:
        ACID_ACTION_REF: ${{ github.action_ref }}
        ACID_ACTION_REPO: ${{ github.action_repository }}
        ACID_RUNNER_OS: ${{ runner.os }}
      run: |
        set -euo pipefail
        ref="${ACID_ACTION_REF:-}"
        ref="${ref#refs/tags/}"
        repo="${ACID_ACTION_REPO:-}"
        bin="${RUNNER_TEMP}/acid-judge-linux-x86_64"
        if [ "${ACID_RUNNER_OS}" != "Linux" ] || [ -z "$repo" ] || [[ ! "$ref" =~ ^v0\.2\.[0-9]+$ ]]; then
          echo "supervisor fetch skipped (need Linux + release tag v0.2.n)"
          exit 0
        fi
        url="https://github.com/${repo}/releases/download/${ref}/acid-judge-linux-x86_64"
        sum_url="https://github.com/${repo}/releases/download/${ref}/acid-judge-linux-x86_64.sha256"
        if ! curl -fsSL --proto '=https' --tlsv1.2 "$url" -o "$bin"; then
          echo "supervisor asset missing; python-cli fallback"
          exit 0
        fi
        if [ ! -s "$bin" ] || [ "$(head -c 4 "$bin")" != $'\x7fELF' ]; then
          echo "supervisor asset is not an ELF; python-cli fallback"
          rm -f "$bin"
          exit 0
        fi
        sum_file="${bin}.sha256"
        if ! curl -fsSL --proto '=https' --tlsv1.2 "$sum_url" -o "$sum_file"; then
          echo "supervisor checksum missing; python-cli fallback"
          rm -f "$bin"
          exit 0
        fi
        if ! (cd "$(dirname "$bin")" && sha256sum -c "$(basename "$sum_file")"); then
          echo "checksum mismatch"
          rm -f "$bin" "$sum_file"
          exit 0
        fi
        chmod +x "$bin"
        echo "ACID_SUPERVISOR=$bin" >> "$GITHUB_ENV"
        echo "fetched $url"
    - name: Verify lock index
      shell: bash
      env:
        ACID_INDEX: ${{ inputs.index }}
        ACID_JUDGE: ${{ inputs.judge }}
        ACID_RECEIPTS: ${{ inputs.receipts }}
      run: |
        set -euo pipefail
        if [ -n "${ACID_SUPERVISOR:-}" ] && [ -x "$ACID_SUPERVISOR" ]; then
          echo "path=supervisor"
          python -m acid_engine.action_driver --bin "$ACID_SUPERVISOR" --index "$ACID_INDEX" --receipts "$ACID_RECEIPTS"
        else
          echo "path=python-cli"
          extra=()
          if [ "$ACID_JUDGE" = "true" ]; then
            extra=(--judge --receipts "$ACID_RECEIPTS")
          fi
          acid-judge locks --index "$ACID_INDEX" "${extra[@]}"
        fi
    - name: Upload receipts
      if: ${{ inputs.judge == 'true' && always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: receipts
        path: ${{ inputs.receipts }}
        if-no-files-found: ignore
